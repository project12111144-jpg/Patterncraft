<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Craft — Sign In</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --cream:#FBF3E7;
    --cream-2:#F5E9D8;
    --ink:#2B2320;
    --ink-soft:#6B5F55;
    --thread-purple:#7C6FE0;
    --thread-blue:#4E8FE0;
    --thread-pink:#E06F9B;
    --line:#E7D9C4;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family:'Manrope', sans-serif;
    background:linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    min-height:100vh;
    padding:0;
  }

  .wrap{
    max-width:420px;
    margin:0 auto;
    padding:40px 24px 24px;
  }

  .brand{ text-align:center; margin-bottom:6px; }

  .logo-word{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:42px;
    background:linear-gradient(90deg, var(--thread-purple), var(--thread-pink) 35%, #E0954E 65%, var(--thread-blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .brand-name{
    font-weight:700;
    font-size:15px;
    letter-spacing:6px;
    color:var(--ink);
    margin-top:6px;
  }

  .brand-tag{
    font-size:10px;
    letter-spacing:3px;
    color:var(--ink-soft);
    margin-top:4px;
    text-transform:uppercase;
  }

  .headline{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:24px;
    color:var(--ink);
    margin:26px 0 6px;
    line-height:1.3;
  }

  .subline{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
    margin-bottom:24px;
  }

  .field{ margin-bottom:16px; }

  .field label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    color:var(--ink-soft);
    margin-bottom:7px;
    text-transform:uppercase;
  }

  .field input{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:#FFFDF9;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
  }
  .field input:focus{ border-color:#5B6EF0; }

  .btn-primary{
    width:100%;
    border:none;
    padding:15px 0;
    border-radius:16px;
    background:#5B6EF0;
    color:#fff;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 10px 22px -10px rgba(91,110,240,0.55);
  }
  .btn-primary:disabled{ opacity:0.6; }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin:18px 0;
  }
  .divider span{
    font-size:11px; color:var(--ink-soft); font-weight:600;
    letter-spacing:1px;
  }
  .divider::before, .divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }

  .google-btn{
    width:100%;
    display:flex; align-items:center; justify-content:center;
    gap:10px;
    padding:13px 0;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:#FFFDF9;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
  }
  .google-btn:disabled{ opacity:0.6; }

  .switch-row{
    text-align:center;
    margin-top:18px;
    font-size:13px;
  }
  .switch-row a{
    color:#5B6EF0;
    font-weight:700;
    text-decoration:none;
  }

  .msg{
    margin-top:14px;
    padding:12px 14px;
    border-radius:12px;
    font-size:13px;
    display:none;
  }
  .msg.error{ background:#FCE4E4; color:#A33; display:block; }
  .msg.success{ background:#E4F7E9; color:#276B3C; display:block; }
</style>
</head>
<body>

<div class="wrap">

  <div class="brand">
    <div class="logo-word">PCT</div>
    <div class="brand-name">PATTERN&nbsp;CRAFT</div>
    <div class="brand-tag">Design · Create · Print</div>
  </div>

  <div id="authBox">
    <div class="headline">Every stitch<br>begins here.</div>
    <div class="subline">Sign in to pick up your blueprints, fabric zones and orders — right where you left them.</div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>

    <button class="btn-primary" id="signInBtn">Sign In</button>

    <div class="divider"><span>OR</span></div>

    <button class="google-btn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4 24 4c-7.4 0-13.8 4.1-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.5 35.4 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.9 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.6 5.4C39.9 36.9 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="switch-row">
      <span id="switchText">New here?</span>
      <a href="#" id="switchLink">Create your account</a>
    </div>

    <div class="msg" id="msgBox"></div>
  </div>

</div>

<!-- Firebase SDK (script tag version — no npm/node needed) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
    GoogleAuthProvider,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCD4WU_MFzrgwRxQtvLgk3DByCbGIDoH7I",
    authDomain: "pattern-craft.firebaseapp.com",
    projectId: "pattern-craft",
    storageBucket: "pattern-craft.firebasestorage.app",
    messagingSenderId: "461067400933",
    appId: "1:461067400933:web:61b35d13dda8a1f5ba860c",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let isNewUser = false;

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const signInBtn = document.getElementById('signInBtn');
  const switchLink = document.getElementById('switchLink');
  const switchText = document.getElementById('switchText');
  const msgBox = document.getElementById('msgBox');
  const authBox = document.getElementById('authBox');

  function showMsg(text, type){
    msgBox.textContent = text;
    msgBox.className = 'msg ' + type;
  }

  switchLink.addEventListener('click', (e) => {
    e.preventDefault();
    isNewUser = !isNewUser;
    signInBtn.textContent = isNewUser ? 'Create Account' : 'Sign In';
    switchText.textContent = isNewUser ? 'Already have an account?' : 'New here?';
    switchLink.textContent = isNewUser ? 'Sign in' : 'Create your account';
  });

  signInBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if(!email || !password){
      showMsg('Email aur password dono bharo.', 'error');
      return;
    }

    signInBtn.disabled = true;
    signInBtn.textContent = 'Please wait...';

    try {
      if(isNewUser){
        await createUserWithEmailAndPassword(auth, email, password);
        showMsg('Account ban gaya! Aap sign in ho chuke hain.', 'success');
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch(err){
      showMsg(err.message, 'error');
    } finally {
      signInBtn.disabled = false;
      signInBtn.textContent = isNewUser ? 'Create Account' : 'Sign In';
    }
  });

  const googleBtn = document.getElementById('googleBtn');
  const googleProvider = new GoogleAuthProvider();

  googleBtn.addEventListener('click', async () => {
    googleBtn.disabled = true;
    try {
      await signInWithPopup(auth, googleProvider);
    } catch(err){
      showMsg(err.message, 'error');
    } finally {
      googleBtn.disabled = false;
    }
  });

  onAuthStateChanged(auth, (user) => {
    if(user){
      // Cache-busting: har baar unique timestamp jodte hain taaki
      // browser purani cached home.html kabhi na dikhaye
      window.location.href = 'pattern-craft-home.html?v=' + Date.now();
    } else {
      authBox.style.display = 'block';
    }
  });
</script>

</body>
</html>
