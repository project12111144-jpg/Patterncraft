<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Craft — New Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2340;
    --sub:#5b6478;
    --purple:#5B47E0;
    --line:#e9ecf7;
    --canvas:#FBF6EC;
    --grid:#E9DFC7;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:'Inter',sans-serif;
    background:#eef1fb;
    color:var(--ink);
    overflow:hidden;
  }
  .screen{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    background:#fff;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .icon-btn{
    width:38px;height:38px;
    border-radius:11px;
    border:1px solid var(--line);
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
    cursor:pointer;
    flex-shrink:0;
  }
  .title-block{ flex:1; min-width:0; }
  .title-block h1{
    font-family:'Poppins',sans-serif;
    font-size:17px;
    font-weight:600;
    margin:0;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .title-block p{
    font-size:12px;
    color:var(--sub);
    margin:1px 0 0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .save-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--purple);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 8px 18px -8px rgba(91,71,224,0.55);
  }

  /* ---------- CANVAS ---------- */
  .canvas-wrap{
    position:relative;
    flex:1;
    min-height:0;
    background:#f2ede0;
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    cursor:grab;
  }
  .canvas-wrap.panning{ cursor:grabbing; }
  .canvas-surface{
    position:absolute;
    top:0; left:0;
    width:5000px;
    height:5000px;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--canvas);
    transform-origin:0 0;
    will-change:transform;
  }
  .blank-page{
    position:absolute;
    width:340px;
    height:340px;
    background:#fff;
    border-radius:6px;
    box-shadow:0 10px 34px rgba(30,30,60,0.18), 0 0 0 1px rgba(30,30,60,0.06);
  }

  /* zoom controls */
  .zoom-controls{
    position:absolute;
    right:14px;
    bottom:16px;
    display:flex;
    align-items:center;
    background:#fff;
    border-radius:30px;
    box-shadow:0 10px 24px rgba(20,20,50,0.12);
    padding:6px;
    gap:2px;
    z-index:5;
  }
  .zoom-controls button{
    width:34px;height:34px;
    border:none;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
    cursor:pointer;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
  }
  .zoom-controls button:hover{ background:#f2f3fa; }
  .zoom-label{
    font-size:12px;
    font-weight:700;
    color:var(--sub);
    width:44px;
    text-align:center;
    flex-shrink:0;
    cursor:pointer;
  }

  /* right vertical toolbar */
  .toolbar{
    position:absolute;
    top:16px;
    right:14px;
    bottom:16px;
    width:78px;
    background:#fff;
    border-radius:20px;
    box-shadow:0 12px 30px rgba(20,20,50,0.10);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    padding:10px 6px;
    gap:2px;
    overflow-y:auto;
    touch-action:pan-y;
    overscroll-behavior:contain;
    z-index:5;
  }
  .tool{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    padding:10px 4px;
    border-radius:14px;
    cursor:pointer;
    color:var(--sub);
    flex-shrink:0;
  }
  .tool.active{
    background:#EFEBFE;
    color:var(--purple);
  }
  .tool svg{ flex-shrink:0; }

  .tool-group{ flex-shrink:0; }
  .tool-group .tool{ width:100%; }
  .subtools{
    display:none;
    flex-direction:column;
    gap:2px;
    background:#F7F6FD;
    border-radius:12px;
    padding:4px;
    margin:0 2px 4px;
  }
  .tool-group.open .subtools{ display:flex; }
  .tool-group.open > .tool{
    background:#EFEBFE;
    color:var(--purple);
  }
  .subtools .tool{ padding:8px 4px; }
  .tool span{
    font-size:10.5px;
    font-weight:600;
    text-align:center;
    line-height:1.15;
  }

  /* undo/redo pill */
  .undo-pill{
    position:absolute;
    left:16px;
    bottom:16px;
    display:flex;
    align-items:center;
    background:#fff;
    border-radius:30px;
    box-shadow:0 10px 24px rgba(20,20,50,0.12);
    padding:10px 8px;
    gap:6px;
    z-index:5;
  }
  .undo-pill button{
    width:34px;height:34px;
    border:none;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
    cursor:pointer;
    border-radius:10px;
  }
  .undo-pill button:disabled{ color:#c2c8d9; cursor:default; }
  .undo-pill .sep{
    width:1px;height:20px;
    background:var(--line);
  }

  /* ---------- LIBRARY PANEL ---------- */
  .library{
    flex-shrink:0;
    background:#fff;
    border-top:1px solid var(--line);
    padding:16px 16px 20px;
  }
  .library-scroll{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .lib-item{
    flex-shrink:0;
    width:104px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .lib-folder{
    width:100%;
    height:88px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:#fbfbfe;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lib-folder::before{
    content:'';
    position:absolute;
    top:-7px; left:14px;
    width:34px; height:9px;
    background:#fbfbfe;
    border:1.5px solid var(--line);
    border-bottom:none;
    border-radius:6px 6px 0 0;
  }
  .lib-item span{
    font-family:'Poppins',sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
  }

  /* ---------- BOTTOM SHEET (library panel) ---------- */
  .sheet-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,20,40,0.28);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:20;
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }

  .bottom-sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    height:42vh;
    background:#fff;
    border-radius:22px 22px 0 0;
    box-shadow:0 -12px 34px rgba(20,20,50,0.18);
    transform:translateY(100%);
    transition:transform .28s ease;
    z-index:21;
    display:flex;
    flex-direction:column;
  }
  .bottom-sheet.open{ transform:translateY(0); }
  .sheet-handle{
    width:38px;height:4px;
    background:var(--line);
    border-radius:3px;
    margin:10px auto 4px;
    flex-shrink:0;
  }
  .sheet-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 18px 12px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .sheet-header h3{
    font-family:'Poppins',sans-serif;
    font-size:15.5px;
    margin:0;
  }
  .sheet-close{
    width:30px;height:30px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    color:var(--sub);
    cursor:pointer;
  }
  .sheet-body{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:16px 18px 20px;
  }
  .sheet-empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--sub);
    font-size:13px;
    line-height:1.6;
  }
  .sheet-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(84px, 1fr));
    gap:12px;
  }
  .sheet-grid-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    padding:8px 4px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fbfbfe;
  }
  .sheet-grid-item:active{ background:#F2F1FA; border-color:var(--purple); }
  .sheet-grid-item img{
    width:100%;
    height:64px;
    object-fit:contain;
  }
  .sheet-grid-item span{
    font-size:10.5px;
    color:var(--sub);
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
  }

  @media (max-width:600px){
    .toolbar{ width:64px; }
    .tool span{ font-size:9px; }
    .lib-item{ width:84px; }
    .lib-folder{ height:72px; }
  }
</style>
</head>
<body>

<div class="screen">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="icon-btn" id="backBtn" title="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="title-block">
      <h1>New Blueprint</h1>
      <p>Create your shirt design</p>
    </div>
    <button class="save-btn" id="saveBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <div class="icon-btn" title="More options">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none"/></svg>
    </div>
  </div>

  <!-- CANVAS -->
  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-surface" id="canvasSurface"></div>


    <!-- RIGHT TOOLBAR -->
    <div class="toolbar" id="toolbar">

      <div class="tool-group" id="fillZoneGroup">
        <div class="tool" data-tool="fillzone" data-group="fillZoneGroup">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l3 5-8 8-5-5z"/><path d="M7 15l-4 4a2 2 0 002.8 2.8l4-4"/><path d="M13 7l6 6"/></svg>
          <span>Fill Zone</span>
        </div>
        <div class="subtools">
          <div class="tool active" data-tool="select">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 3l7.07 17 2.51-7.39L21 10.07z"/></svg>
            <span>Select</span>
          </div>
          <div class="tool" data-tool="color">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c4-4.5 7-8 7-11.5A7 7 0 005 9.5C5 13 8 16.5 12 21z"/></svg>
            <span>Color</span>
          </div>
        </div>
      </div>

      <div class="tool" data-tool="blankpage" id="blankPageBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
        <span>New Page</span>
      </div>

      <div class="tool-group" id="drawGroup">
        <div class="tool" data-tool="draw" data-group="drawGroup">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>
          <span>Draw</span>
        </div>
        <div class="subtools">
          <div class="tool" data-tool="smartpencil">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
            <span>Smart Pencil</span>
          </div>
          <div class="tool" data-tool="eraser">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 20H8l-6-6a2 2 0 010-2.8l9-9a2 2 0 012.8 0l6.2 6.2a2 2 0 010 2.8L13 18"/><path d="M6.5 11.5l6 6"/></svg>
            <span>Eraser</span>
          </div>
        </div>
      </div>

      <div class="tool" data-tool="text">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        <span>Text</span>
      </div>
      <div class="tool" data-tool="more">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>More</span>
      </div>
    </div>

    <!-- UNDO / REDO -->
    <div class="undo-pill">
      <button id="undoBtn" title="Undo" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M4 9h10.5a5.5 5.5 0 015.5 5.5v0a5.5 5.5 0 01-5.5 5.5H11"/></svg>
      </button>
      <div class="sep"></div>
      <button id="redoBtn" title="Redo" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M20 9H9.5A5.5 5.5 0 004 14.5v0A5.5 5.5 0 009.5 20H13"/></svg>
      </button>
    </div>

    <!-- ZOOM CONTROLS -->
    <div class="zoom-controls">
      <button id="zoomOutBtn" title="Zoom out">–</button>
      <span class="zoom-label" id="zoomLabel" title="Reset zoom">100%</span>
      <button id="zoomInBtn" title="Zoom in">+</button>
    </div>
  </div>

  <!-- LIBRARY PANEL -->
  <div class="library">
    <div class="library-scroll" id="libraryScroll">
      <div class="lib-item" data-lib="body">
        <div class="lib-folder">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1c2340" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4Q12 6.4 15 4L19.5 7.2L17 10.5L15 9V19.5Q15 20.5 14 20.5H10Q9 20.5 9 19.5V9L7 10.5L4.5 7.2Z"/></svg>
        </div>
        <span>Body</span>
      </div>
      <div class="lib-item" data-lib="pockets">
        <div class="lib-folder">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1c2340" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4H19V13Q19 19.5 12 20.5Q5 19.5 5 13Z"/></svg>
        </div>
        <span>Pockets</span>
      </div>
      <div class="lib-item" data-lib="collars">
        <div class="lib-folder">
          <svg width="32" height="22" viewBox="0 0 24 24" fill="none" stroke="#1c2340" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12Q7 6 3.5 8Q3.5 13 12 12Q17 6 20.5 8Q20.5 13 12 12Z"/><circle cx="12" cy="12" r="1" fill="#1c2340" stroke="none"/></svg>
        </div>
        <span>Collars</span>
      </div>
      <div class="lib-item" data-lib="cuffs">
        <div class="lib-folder">
          <svg width="32" height="22" viewBox="0 0 24 24" fill="none" stroke="#1c2340" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="12" height="8" rx="4"/><ellipse cx="16.5" cy="12" rx="3" ry="4.2"/></svg>
        </div>
        <span>Cuffs</span>
      </div>
      <div class="lib-item" data-lib="placket">
        <div class="lib-folder">
          <svg width="18" height="30" viewBox="0 0 24 24" fill="none" stroke="#1c2340" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="18" rx="1.5"/><circle cx="12" cy="7.5" r="0.9" fill="#1c2340" stroke="none"/><circle cx="12" cy="12" r="0.9" fill="#1c2340" stroke="none"/><circle cx="12" cy="16.5" r="0.9" fill="#1c2340" stroke="none"/></svg>
        </div>
        <span>Placket</span>
      </div>
      <div class="lib-item" data-lib="stitch">
        <div class="lib-folder">
          <svg width="36" height="20" viewBox="0 0 36 20" fill="none" stroke="#1c2340" stroke-width="1.7" stroke-linecap="round"><line x1="2" y1="6" x2="8" y2="6"/><line x1="12" y1="6" x2="18" y2="6"/><line x1="22" y1="6" x2="28" y2="6"/><line x1="32" y1="6" x2="34" y2="6"/><line x1="2" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="18" y2="14"/><line x1="22" y1="14" x2="28" y2="14"/><line x1="32" y1="14" x2="34" y2="14"/></svg>
        </div>
        <span>Stitch</span>
      </div>
    </div>
  </div>

  <!-- BOTTOM SHEET (library content panel) -->
  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 id="sheetTitle">Body</h3>
      <div class="sheet-close" id="sheetClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>
    <div class="sheet-body">
      <div class="sheet-empty" id="sheetEmpty">Items yahan jald hi aayenge.</div>
      <div class="sheet-grid" id="sheetGrid" style="display:none;"></div>
    </div>
  </div>

</div>

<script>
  // Back button -> home
  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = 'pattern-craft-home.html?v=' + Date.now();
  });

  // Toolbar tool selection (visual only for now — actual drawing logic aayega baad mein)
  document.querySelectorAll('.toolbar .tool').forEach(el => {
    el.addEventListener('click', (e) => {
      const groupName = el.dataset.group;

      // Agar ye ek group-header hai (Fill Zone / Draw) to expand/collapse karo
      if(groupName){
        const group = document.getElementById(groupName);
        const wasOpen = group.classList.contains('open');
        document.querySelectorAll('.tool-group').forEach(g => g.classList.remove('open'));
        if(!wasOpen) group.classList.add('open');
        return;
      }

      // "New Page" button ka apna alag kaam hai (blank sheet banana), select highlight nahi
      if(el.dataset.tool === 'blankpage'){
        addBlankPage();
        return;
      }

      document.querySelectorAll('.toolbar .tool').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    });
  });

  // "New Page" — canvas ke current center me ek safed square sheet daalta hai design banane ke liye
  let pageCount = 0;
  function addBlankPage(){
    pageCount++;
    const page = document.createElement('div');
    page.className = 'blank-page';
    const r = wrap.getBoundingClientRect();
    // wrap ke center ko surface coordinates me convert karna (zoom/pan account karke)
    const centerX = (r.width / 2 - tx) / scale;
    const centerY = (r.height / 2 - ty) / scale;
    const size = 340;
    page.style.left = (centerX - size / 2 + pageCount * 18) + 'px';
    page.style.top = (centerY - size / 2 + pageCount * 18) + 'px';
    surface.appendChild(page);
  }

  // Save button placeholder
  document.getElementById('saveBtn').addEventListener('click', () => {
    alert('Blueprint save hone ka feature abhi jud raha hai.');
  });

  // ---------- BOTTOM SHEET (Body / Pockets / Collars / Cuffs / Placket) ----------
  // Stitch ko abhi chhod diya hai, jaisa bataya gaya
  const sheetOverlay = document.getElementById('sheetOverlay');
  const bottomSheet = document.getElementById('bottomSheet');
  const sheetTitle = document.getElementById('sheetTitle');
  const sheetEmpty = document.getElementById('sheetEmpty');
  const sheetGrid = document.getElementById('sheetGrid');

  const libLabels = {
    body: 'Body',
    pockets: 'Pockets',
    collars: 'Collars',
    cuffs: 'Cuffs',
    placket: 'Placket'
  };

  // GitHub repo details — jahan har category ka apna folder hai (assets/<category>/)
  const GH_USER = 'project12111144-jpg';
  const GH_REPO = 'Patterncraft';
  const GH_BRANCH = 'main';

  const libraryCache = {}; // category -> [{name, url}]

  async function fetchLibraryItems(category){
    if(libraryCache[category]) return libraryCache[category];
    const apiUrl = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/assets/${category}?ref=${GH_BRANCH}`;
    const res = await fetch(apiUrl);
    if(!res.ok) throw new Error('GitHub folder nahi mila: ' + category);
    const files = await res.json();
    const items = files
      .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.svg'))
      .map(f => ({
        name: f.name.replace(/\.svg$/i, '').replace(/[-_]/g, ' '),
        url: f.download_url
      }));
    libraryCache[category] = items;
    return items;
  }

  async function openSheet(libKey){
    sheetTitle.textContent = libLabels[libKey] || libKey;
    sheetOverlay.classList.add('open');
    bottomSheet.classList.add('open');

    sheetGrid.style.display = 'none';
    sheetEmpty.style.display = 'flex';
    sheetEmpty.textContent = 'Load ho raha hai...';

    try {
      const items = await fetchLibraryItems(libKey);
      if(items.length === 0){
        sheetEmpty.textContent = 'Abhi is category me koi SVG nahi hai. GitHub ke assets/' + libKey + '/ folder me SVG daal dijiye.';
        sheetEmpty.style.display = 'flex';
        sheetGrid.style.display = 'none';
        return;
      }
      sheetGrid.innerHTML = '';
      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'sheet-grid-item';
        el.innerHTML = `<img src="${item.url}" alt="${item.name}"><span>${item.name}</span>`;
        el.addEventListener('click', () => {
          addLibraryItemToCanvas(item);
          closeSheet();
        });
        sheetGrid.appendChild(el);
      });
      sheetEmpty.style.display = 'none';
      sheetGrid.style.display = 'grid';
    } catch(err){
      sheetEmpty.textContent = 'Load nahi ho paya. GitHub par assets/' + libKey + '/ folder bana hai ya nahi check karein.';
      sheetEmpty.style.display = 'flex';
      sheetGrid.style.display = 'none';
    }
  }

  function closeSheet(){
    sheetOverlay.classList.remove('open');
    bottomSheet.classList.remove('open');
  }

  document.querySelectorAll('.lib-item').forEach(item => {
    const key = item.dataset.lib;
    if(key === 'stitch') return; // Stitch abhi ke liye chhoda hai
    item.addEventListener('click', () => openSheet(key));
  });

  sheetOverlay.addEventListener('click', closeSheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);

  // Library se select kiya hua SVG canvas ke center me daalna
  let itemCount = 0;
  function addLibraryItemToCanvas(item){
    itemCount++;
    const el = document.createElement('img');
    el.src = item.url;
    el.alt = item.name;
    el.className = 'canvas-item';
    const r = wrap.getBoundingClientRect();
    const centerX = (r.width / 2 - tx) / scale;
    const centerY = (r.height / 2 - ty) / scale;
    const size = 320;
    el.style.position = 'absolute';
    el.style.width = size + 'px';
    el.style.left = (centerX - size / 2 + itemCount * 16) + 'px';
    el.style.top = (centerY - size / 2 + itemCount * 16) + 'px';
    el.style.pointerEvents = 'none';
    surface.appendChild(el);
  }

  // ---------- CANVAS ZOOM + PAN ----------
  const wrap = document.getElementById('canvasWrap');
  const surface = document.getElementById('canvasSurface');
  const zoomLabel = document.getElementById('zoomLabel');
  const SURFACE_SIZE = 5000;
  const MIN_SCALE = 0.35;
  const MAX_SCALE = 3;

  let scale = 1, tx = 0, ty = 0;

  function applyTransform(){
    surface.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    zoomLabel.textContent = Math.round(scale * 100) + '%';
  }

  function centerCanvas(){
    const r = wrap.getBoundingClientRect();
    tx = (r.width - SURFACE_SIZE * scale) / 2;
    ty = (r.height - SURFACE_SIZE * scale) / 2;
    applyTransform();
  }

  function zoomAt(clientX, clientY, factor){
    const r = wrap.getBoundingClientRect();
    const px = clientX - r.left;
    const py = clientY - r.top;
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
    if(newScale === scale) return;
    const ratio = newScale / scale;
    tx = px - (px - tx) * ratio;
    ty = py - (py - ty) * ratio;
    scale = newScale;
    applyTransform();
  }

  // mouse wheel zoom (also handles trackpad pinch which fires wheel + ctrlKey)
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    zoomAt(e.clientX, e.clientY, factor);
  }, { passive:false });

  // pointer-based pan + pinch-zoom (works for mouse drag and touch)
  const activePointers = new Map();
  let panStart = null;
  let lastPinchDist = null;

  function isInteractive(target){
    return target.closest('.toolbar, .undo-pill, .zoom-controls');
  }

  wrap.addEventListener('pointerdown', (e) => {
    if(isInteractive(e.target)) return;
    wrap.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(activePointers.size === 1){
      panStart = { x:e.clientX, y:e.clientY, tx, ty };
      wrap.classList.add('panning');
    } else if(activePointers.size === 2){
      const pts = [...activePointers.values()];
      lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }
  });

  wrap.addEventListener('pointermove', (e) => {
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if(activePointers.size === 2){
      const pts = [...activePointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const midX = (pts[0].x + pts[1].x) / 2;
      const midY = (pts[0].y + pts[1].y) / 2;
      if(lastPinchDist){
        zoomAt(midX, midY, dist / lastPinchDist);
      }
      lastPinchDist = dist;
    } else if(activePointers.size === 1 && panStart){
      tx = panStart.tx + (e.clientX - panStart.x);
      ty = panStart.ty + (e.clientY - panStart.y);
      applyTransform();
    }
  });

  function releasePointer(e){
    activePointers.delete(e.pointerId);
    wrap.classList.remove('panning');
    if(activePointers.size < 2) lastPinchDist = null;
    if(activePointers.size === 1){
      const [remaining] = [...activePointers.values()];
      panStart = { x:remaining.x, y:remaining.y, tx, ty };
      wrap.classList.add('panning');
    } else if(activePointers.size === 0){
      panStart = null;
    }
  }
  wrap.addEventListener('pointerup', releasePointer);
  wrap.addEventListener('pointercancel', releasePointer);

  // zoom buttons
  document.getElementById('zoomInBtn').addEventListener('click', () => {
    const r = wrap.getBoundingClientRect();
    zoomAt(r.left + r.width/2, r.top + r.height/2, 1.2);
  });
  document.getElementById('zoomOutBtn').addEventListener('click', () => {
    const r = wrap.getBoundingClientRect();
    zoomAt(r.left + r.width/2, r.top + r.height/2, 1/1.2);
  });
  zoomLabel.addEventListener('click', () => {
    scale = 1;
    centerCanvas();
  });

  window.addEventListener('resize', centerCanvas);
  centerCanvas();
</script>

</body>
</html>
