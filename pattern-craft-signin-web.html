<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Craft — Sign In</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --cream:#FBF3E7;
    --cream-2:#F5E9D8;
    --ink:#2B2320;
    --ink-soft:#6B5F55;
    --thread-purple:#7C6FE0;
    --thread-blue:#4E8FE0;
    --thread-pink:#E06F9B;
    --line:#E7D9C4;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family:'Manrope', sans-serif;
    background:linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    min-height:100vh;
    padding:0;
  }

  .wrap{
    max-width:420px;
    margin:0 auto;
    padding:40px 24px 24px;
  }

  .brand{ text-align:center; margin-bottom:6px; }

  .logo-word{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:42px;
    background:linear-gradient(90deg, var(--thread-purple), var(--thread-pink) 35%, #E0954E 65%, var(--thread-blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .brand-name{
    font-weight:700;
    font-size:15px;
    letter-spacing:6px;
    color:var(--ink);
    margin-top:6px;
  }

  .brand-tag{
    font-size:10px;
    letter-spacing:3px;
    color:var(--ink-soft);
    margin-top:4px;
    text-transform:uppercase;
  }

  .headline{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:24px;
    color:var(--ink);
    margin:26px 0 6px;
    line-height:1.3;
  }

  .subline{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
    margin-bottom:24px;
  }

  .field{ margin-bottom:16px; }

  .field label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    color:var(--ink-soft);
    margin-bottom:7px;
    text-transform:uppercase;
  }

  .field input{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:#FFFDF9;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
  }
  .field input:focus{ border-color:#5B6EF0; }

  .btn-primary{
    width:100%;
    border:none;
    padding:15px 0;
    border-radius:16px;
    background:#5B6EF0;
    color:#fff;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 10px 22px -10px rgba(91,110,240,0.55);
  }
  .btn-primary:disabled{ opacity:0.6; }

  .switch-row{
    text-align:center;
    margin-top:18px;
    font-size:13px;
  }
  .switch-row a{
    color:#5B6EF0;
    font-weight:700;
    text-decoration:none;
  }

  .msg{
    margin-top:14px;
    padding:12px 14px;
    border-radius:12px;
    font-size:13px;
    display:none;
  }
  .msg.error{ background:#FCE4E4; color:#A33; display:block; }
  .msg.success{ background:#E4F7E9; color:#276B3C; display:block; }

  .home{
    display:none;
    text-align:center;
    padding-top:60px;
  }
  .home h2{ font-family:'Fraunces', serif; color:var(--ink); }
  .home p{ color:var(--ink-soft); font-size:13px; }
  .signout{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:14px;
    background:var(--thread-pink);
    color:#fff;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="brand">
    <div class="logo-word">PCT</div>
    <div class="brand-name">PATTERN&nbsp;CRAFT</div>
    <div class="brand-tag">Design · Create · Print</div>
  </div>

  <div id="authBox">
    <div class="headline">Every stitch<br>begins here.</div>
    <div class="subline">Sign in to pick up your blueprints, fabric zones and orders — right where you left them.</div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>

    <button class="btn-primary" id="signInBtn">Sign In</button>

    <div class="switch-row">
      <span id="switchText">New here?</span>
      <a href="#" id="switchLink">Create your account</a>
    </div>

    <div class="msg" id="msgBox"></div>
  </div>

  <div class="home" id="homeBox">
    <h2 id="welcomeText">Welcome back!</h2>
    <p>Login successful. Aage yahin par Home screen ka poora design jodenge.</p>
    <button class="signout" id="signOutBtn">Sign Out</button>
  </div>

</div>

<!-- Firebase SDK (script tag version — no npm/node needed) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCD4WU_MFzrgwRxQtvLgk3DByCbGIDoH7I",
    authDomain: "pattern-craft.firebaseapp.com",
    projectId: "pattern-craft",
    storageBucket: "pattern-craft.firebasestorage.app",
    messagingSenderId: "461067400933",
    appId: "1:461067400933:web:61b35d13dda8a1f5ba860c",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let isNewUser = false;

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const signInBtn = document.getElementById('signInBtn');
  const switchLink = document.getElementById('switchLink');
  const switchText = document.getElementById('switchText');
  const msgBox = document.getElementById('msgBox');
  const authBox = document.getElementById('authBox');
  const homeBox = document.getElementById('homeBox');
  const welcomeText = document.getElementById('welcomeText');
  const signOutBtn = document.getElementById('signOutBtn');

  function showMsg(text, type){
    msgBox.textContent = text;
    msgBox.className = 'msg ' + type;
  }

  switchLink.addEventListener('click', (e) => {
    e.preventDefault();
    isNewUser = !isNewUser;
    signInBtn.textContent = isNewUser ? 'Create Account' : 'Sign In';
    switchText.textContent = isNewUser ? 'Already have an account?' : 'New here?';
    switchLink.textContent = isNewUser ? 'Sign in' : 'Create your account';
  });

  signInBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if(!email || !password){
      showMsg('Email aur password dono bharo.', 'error');
      return;
    }

    signInBtn.disabled = true;
    signInBtn.textContent = 'Please wait...';

    try {
      if(isNewUser){
        await createUserWithEmailAndPassword(auth, email, password);
        showMsg('Account ban gaya! Aap sign in ho chuke hain.', 'success');
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch(err){
      showMsg(err.message, 'error');
    } finally {
      signInBtn.disabled = false;
      signInBtn.textContent = isNewUser ? 'Create Account' : 'Sign In';
    }
  });

  signOutBtn.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if(user){
      authBox.style.display = 'none';
      homeBox.style.display = 'block';
      welcomeText.textContent = 'Welcome back, ' + user.email;
    } else {
      authBox.style.display = 'block';
      homeBox.style.display = 'none';
    }
  });
</script>

</body>
</html>
